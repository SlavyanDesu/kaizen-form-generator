<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create a completed Kaizen improvement report."
    />
    <title>Kaizen Report Generator</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <script src="/script.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <h1>Kaizen Report Generator</h1>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button">
          <span class="theme-icon" aria-hidden="true">◐</span>
        </button>
      </header>

      <section class="form-panel" aria-label="Kaizen report details">
        <form
          action="/api/kaizen/generate"
          method="POST"
          enctype="multipart/form-data"
        >
          <p class="required-note">
            <span class="required-marker" aria-hidden="true">*</span>
            Required fields
          </p>
          <fieldset>
            <legend>Basic Information</legend>

            <div class="field field-wide">
              <label for="theme"
                >Theme <span class="required-marker">*</span></label
              >
              <input type="text" id="theme" name="theme" required />
            </div>

            <div class="field">
              <label for="unit"
                >Unit <span class="required-marker">*</span></label
              >
              <input type="text" id="unit" name="unit" required />
            </div>

            <div class="field">
              <label for="department"
                >Department <span class="required-marker">*</span></label
              >
              <input type="text" id="department" name="department" required />
            </div>

            <div class="field">
              <label for="date"
                >Date <span class="required-marker">*</span></label
              >
              <input type="date" id="date" name="date" required />
            </div>
          </fieldset>

          <fieldset>
            <legend>People</legend>

            <div class="field">
              <label for="suggestedBy"
                >Suggested by <span class="required-marker">*</span></label
              >
              <input type="text" id="suggestedBy" name="suggestedBy" required />
            </div>

            <div class="field">
              <label for="implementedBy"
                >Implemented by <span class="required-marker">*</span></label
              >
              <input
                type="text"
                id="implementedBy"
                name="implementedBy"
                required
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Kaizen Details</legend>

            <div class="field field-wide">
              <label for="problem"
                >Problem <span class="required-marker">*</span></label
              >
              <textarea id="problem" name="problem" required></textarea>
            </div>

            <div class="field field-wide">
              <label for="whereFound"
                >Where found <span class="required-marker">*</span></label
              >
              <textarea id="whereFound" name="whereFound" required></textarea>
            </div>

            <div class="field">
              <label for="whenFound"
                >When found <span class="required-marker">*</span></label
              >
              <input type="date" id="whenFound" name="whenFound" required />
            </div>

            <div class="field field-wide">
              <label for="countermeasure"
                >Countermeasure <span class="required-marker">*</span></label
              >
              <textarea
                id="countermeasure"
                name="countermeasure"
                required
              ></textarea>
            </div>

            <div class="field field-wide">
              <label for="whereImplement"
                >Where implemented <span class="required-marker">*</span></label
              >
              <textarea
                id="whereImplement"
                name="whereImplement"
                required
              ></textarea>
            </div>

            <div class="field">
              <label for="whenImplement"
                >When implemented <span class="required-marker">*</span></label
              >
              <input
                type="date"
                id="whenImplement"
                name="whenImplement"
                required
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Photographs</legend>

            <div class="field">
              <label for="photographBefore">Photograph before</label>
              <input
                type="file"
                id="photographBefore"
                name="photographBefore"
                accept="image/*"
              />
            </div>

            <div class="field">
              <label for="photographAfter">Photograph after</label>
              <input
                type="file"
                id="photographAfter"
                name="photographAfter"
                accept="image/*"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Results and Benefits</legend>

            <div class="field field-wide">
              <label for="afterKaizen"
                >After Kaizen <span class="required-marker">*</span></label
              >
              <textarea id="afterKaizen" name="afterKaizen" required></textarea>
            </div>

            <div class="field field-wide">
              <label for="tangibleBenefit">Tangible benefit</label>
              <textarea id="tangibleBenefit" name="tangibleBenefit"></textarea>
            </div>

            <div class="field field-wide">
              <label for="intangibleBenefit">Intangible benefit</label>
              <textarea
                id="intangibleBenefit"
                name="intangibleBenefit"
              ></textarea>
            </div>

            <div class="field field-wide">
              <label for="whereImplemented"
                >Where implemented <span class="required-marker">*</span></label
              >
              <textarea
                id="whereImplemented"
                name="whereImplemented"
                required
              ></textarea>
            </div>

            <div class="field">
              <label for="whenImplemented"
                >When implemented <span class="required-marker">*</span></label
              >
              <input
                type="date"
                id="whenImplemented"
                name="whenImplemented"
                required
              />
            </div>

            <input type="hidden" id="issueDate" name="issueDate" />
          </fieldset>

          <div class="form-footer">
            <button type="submit">Generate Excel</button>
          </div>
        </form>

        <div
          class="success-notice"
          id="successNotice"
          role="dialog"
          aria-modal="true"
          aria-labelledby="successNoticeTitle"
          hidden
        >
          <div class="notice-card">
            <p id="successNoticeTitle">
              Excel generated successfully. Create a new Kaizen?
            </p>
            <div class="notice-actions">
              <button id="newKaizenButton" type="button">
                Yes, create another
              </button>
              <button
                class="secondary-button"
                id="dismissNoticeButton"
                type="button"
              >
                No
              </button>
            </div>
          </div>
        </div>
      </section>

      <div
        class="crop-modal"
        id="cropModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cropTitle"
        hidden
      >
        <div class="crop-card">
          <div class="crop-header">
            <h2 id="cropTitle">Crop Photograph</h2>
            <button
              class="crop-close"
              id="cancelCropButton"
              type="button"
              aria-label="Cancel crop"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div class="crop-stage">
            <img id="cropImage" alt="Selected photograph preview" />
          </div>
          <div class="crop-actions">
            <button
              class="secondary-button"
              id="cancelCropAction"
              type="button"
            >
              Cancel
            </button>
            <button id="applyCropButton" type="button">Apply Crop</button>
          </div>
        </div>
      </div>

      <footer class="site-footer">
        <p>© 2026 SlavyanDesu</p>
        <a
          class="github-link"
          href="https://github.com/SlavyanDesu/kaizen-form-generator"
          target="_blank"
          rel="noreferrer"
          aria-label="Kaizen Form Generator on GitHub"
          title="View project on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.24 3.18.77.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"
            />
          </svg>
        </a>
      </footer>
    </main>
  </body>
</html>
