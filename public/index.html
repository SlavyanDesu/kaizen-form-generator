<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate Kaizen forms quickly and easily."
    />
    <meta property="og:title" content="Kaizen Form Generator" />
    <meta
      property="og:description"
      content="Generate Kaizen forms quickly and easily."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kaizen-gen.vercel.app/" />
    <meta
      property="og:image"
      content="https://kaizen-gen.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Kaizen Form Generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://kaizen-gen.vercel.app/og-image.png"
    />

    <title>Kaizen Form Generator</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <script src="/script.js"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <main
      class="mx-auto w-[min(1080px,calc(100%-40px))] py-10 pb-18 max-[680px]:w-[calc(100%-20px)] max-[680px]:max-w-140 max-[680px]:py-7 max-[680px]:pb-11"
    >
      <header
        class="mb-16 flex items-center justify-between gap-8 max-[680px]:mb-9 max-[680px]:block"
      >
        <div>
          <h1
            class="m-0 max-w-175 text-[clamp(2rem,4vw,3.4rem)] font-semibold leading-[1.05] tracking-tighter"
          >
            Kaizen Form Generator
          </h1>
        </div>
        <p class="text-(--muted)">
          Generate Kaizen forms quickly and easily.
        </p>
      </header>

      <section
        class="rounded-xl border border-(--line) bg-(--paper) p-[clamp(24px,4vw,44px)] transition-colors duration-200 max-[680px]:px-4 max-[680px]:py-5.5"
        aria-label="Kaizen form details"
      >
        <form
          class="grid gap-11"
          action="/api/kaizen/generate"
          method="POST"
          enctype="multipart/form-data"
        >
          <p
            class="-mt-5.5 mb-0 text-[0.82rem] text-(--muted) max-[680px]:mt-0 max-[680px]:-mb-5.5"
          >
            <span class="text-red-600" aria-hidden="true">*</span>
            Required fields
          </p>
          <fieldset class="form-section">
            <legend
              class="col-span-full mb-5.5 w-full border-b border-(--line) pb-3.5 text-base font-bold text-(--ink) before:mr-2.5 before:inline-block before:h-1.5 before:w-1.5 before:bg-(--ink) before:content-['']"
            >
              Basic Information
            </legend>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="theme"
                >Theme <span class="text-red-600">*</span></label
              >
              <input type="text" id="theme" name="theme" required />
            </div>

            <div class="grid gap-1.5">
              <label for="unit">Unit <span class="text-red-600">*</span></label>
              <input type="text" id="unit" name="unit" required />
            </div>

            <div class="grid gap-1.5">
              <label for="department"
                >Department <span class="text-red-600">*</span></label
              >
              <input type="text" id="department" name="department" required />
            </div>

            <div class="grid gap-1.5">
              <label for="date">Date <span class="text-red-600">*</span></label>
              <input type="date" id="date" name="date" required />
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend
              class="col-span-full mb-5.5 w-full border-b border-(--line) pb-3.5 text-base font-bold text-(--ink) before:mr-2.5 before:inline-block before:h-1.5 before:w-1.5 before:bg-(--ink) before:content-['']"
            >
              People
            </legend>

            <div class="grid gap-1.5">
              <label for="suggestedBy"
                >Suggested by <span class="text-red-600">*</span></label
              >
              <input type="text" id="suggestedBy" name="suggestedBy" required />
            </div>

            <div class="grid gap-1.5">
              <label for="implementedBy"
                >Implemented by <span class="text-red-600">*</span></label
              >
              <input
                type="text"
                id="implementedBy"
                name="implementedBy"
                required
              />
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend
              class="col-span-full mb-5.5 w-full border-b border-(--line) pb-3.5 text-base font-bold text-(--ink) before:mr-2.5 before:inline-block before:h-1.5 before:w-1.5 before:bg-(--ink) before:content-['']"
            >
              Kaizen Details
            </legend>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="problem"
                >Problem <span class="text-red-600">*</span></label
              >
              <textarea id="problem" name="problem" required></textarea>
            </div>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="whereFound"
                >Where is it found? <span class="text-red-600">*</span></label
              >
              <textarea id="whereFound" name="whereFound" required></textarea>
            </div>

            <div class="grid gap-1.5">
              <label for="whenFound"
                >When is it found? <span class="text-red-600">*</span></label
              >
              <input type="date" id="whenFound" name="whenFound" required />
            </div>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="countermeasure"
                >Countermeasure <span class="text-red-600">*</span></label
              >
              <textarea
                id="countermeasure"
                name="countermeasure"
                required
              ></textarea>
            </div>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="whereImplement"
                >Where want to implement it? <span class="text-red-600">*</span></label
              >
              <textarea
                id="whereImplement"
                name="whereImplement"
                required
              ></textarea>
            </div>

            <div class="grid gap-1.5">
              <label for="whenImplement"
                >When want to implement it? <span class="text-red-600">*</span></label
              >
              <input
                type="date"
                id="whenImplement"
                name="whenImplement"
                required
              />
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend
              class="col-span-full mb-5.5 w-full border-b border-(--line) pb-3.5 text-base font-bold text-(--ink) before:mr-2.5 before:inline-block before:h-1.5 before:w-1.5 before:bg-(--ink) before:content-['']"
            >
              Photographs
            </legend>

            <div class="grid gap-1.5">
              <label for="photographBefore">Photograph before</label>
              <input
                type="file"
                id="photographBefore"
                name="photographBefore"
                accept="image/*"
                class="file:mr-4 file:cursor-pointer file:rounded-md file:border-0 file:bg-black file:px-3 file:py-2 file:font-semibold file:text-white hover:file:bg-gray-700 dark:file:bg-gray-700 dark:file:text-white dark:hover:file:bg-gray-600"
              />
            </div>

            <div class="grid gap-1.5">
              <label for="photographAfter">Photograph after</label>
              <input
                type="file"
                id="photographAfter"
                name="photographAfter"
                accept="image/*"
                class="file:mr-4 file:cursor-pointer file:rounded-md file:border-0 file:bg-black file:px-3 file:py-2 file:font-semibold file:text-white hover:file:bg-gray-700 dark:file:bg-gray-700 dark:file:text-white dark:hover:file:bg-gray-600"
              />
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend
              class="col-span-full mb-5.5 w-full border-b border-(--line) pb-3.5 text-base font-bold text-(--ink) before:mr-2.5 before:inline-block before:h-1.5 before:w-1.5 before:bg-(--ink) before:content-['']"
            >
              Results and Benefits
            </legend>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="afterKaizen"
                >After Kaizen <span class="text-red-600">*</span></label
              >
              <textarea id="afterKaizen" name="afterKaizen" required></textarea>
            </div>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="tangibleBenefit">Tangible benefit</label>
              <textarea id="tangibleBenefit" name="tangibleBenefit"></textarea>
            </div>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="intangibleBenefit">Intangible benefit</label>
              <textarea
                id="intangibleBenefit"
                name="intangibleBenefit"
              ></textarea>
            </div>

            <div class="col-span-full grid gap-1.5 max-[680px]:col-span-1">
              <label for="whereImplemented"
                >Where is it implemented? <span class="text-red-600">*</span></label
              >
              <textarea
                id="whereImplemented"
                name="whereImplemented"
                required
              ></textarea>
            </div>

            <div class="grid gap-1.5">
              <label for="whenImplemented"
                >When is it implemented? <span class="text-red-600">*</span></label
              >
              <input
                type="date"
                id="whenImplemented"
                name="whenImplemented"
                required
              />
            </div>

            <input type="hidden" id="issueDate" name="issueDate" />
          </fieldset>

          <div
            class="flex items-center justify-end gap-5 border-t border-(--line) pt-2 max-[680px]:items-stretch max-[680px]:flex-col"
          >
            <button
              class="min-h-12.5 rounded-lg bg-black px-5.5 font-bold text-white transition-colors duration-150 hover:bg-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ink) max-[680px]:w-full dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600"
              type="submit"
            >
              Generate Excel
            </button>
          </div>
        </form>

        <div
          class="fixed inset-0 z-10 grid place-items-center bg-black/40 p-8 max-[680px]:p-4"
          id="successNotice"
          role="dialog"
          aria-modal="true"
          aria-labelledby="successNoticeTitle"
          hidden
        >
          <div
            class="relative grid w-[min(480px,100%)] gap-6 overflow-hidden rounded-2xl border border-white/30 bg-white/15 p-8 text-(--ink) shadow-[0_8px_32px_0_rgba(0,0,0,0.2)] backdrop-blur-md backdrop-saturate-100 max-[680px]:p-[26px_22px] dark:bg-white/15 dark:text-white"
          >
            <p
              class="m-0 text-[clamp(1.35rem,3vw,2rem)] font-semibold leading-[1.1] tracking-[-0.02em]"
              id="successNoticeTitle"
            >
              Excel generated successfully. Create a new Kaizen?
            </p>
            <div class="flex gap-2.5 max-[680px]:flex-col">
              <button
                class="min-h-10 rounded-lg bg-black px-3.5 text-[0.82rem] font-bold text-white hover:bg-gray-700 max-[680px]:w-full dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600"
                id="newKaizenButton"
                type="button"
              >
                Yes, create another
              </button>
              <button
                class="min-h-10 rounded-lg border border-black bg-transparent px-3.5 text-[0.82rem] font-bold text-black hover:bg-gray-950/5 max-[680px]:w-full dark:border-white/10 dark:text-white dark:hover:bg-white/10"
                id="dismissNoticeButton"
                type="button"
              >
                No
              </button>
            </div>
          </div>
        </div>
      </section>

      <div
        class="fixed inset-0 z-20 grid place-items-center p-4"
        id="cropModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cropTitle"
        hidden
      >
        <div
          class="relative grid w-[min(720px,100%)] gap-4.5 overflow-hidden rounded-2xl border border-white/30 bg-white/15 p-5.5 text-(--ink) shadow-[0_8px_32px_0_rgba(0,0,0,0.2)] backdrop-blur-md backdrop-saturate-100 dark:bg-white/15 dark:text-white"
        >
          <div class="relative z-10 flex items-center justify-between gap-3">
            <h2 class="m-0 text-[1.1rem]" id="cropTitle">Crop Photograph</h2>
            <button
              class="inline-flex min-h-9 w-9 items-center justify-center rounded-lg border border-black bg-transparent p-0 text-black hover:bg-gray-950/5 dark:border-white/10 dark:text-white dark:hover:bg-white/10"
              id="cancelCropButton"
              type="button"
              aria-label="Cancel crop"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div
            class="grid min-h-70 max-h-[60vh] place-items-center overflow-hidden rounded-lg bg-[#111111]"
          >
            <img id="cropImage" alt="Selected photograph preview" />
          </div>
          <div class="flex items-center justify-end gap-2.5">
            <button
              class="min-h-10.5 rounded-lg border border-black bg-transparent px-4 text-[0.82rem] font-bold text-black hover:bg-gray-950/5 dark:border-white/10 dark:text-white dark:hover:bg-white/10"
              id="cancelCropAction"
              type="button"
            >
              Cancel
            </button>
            <button
              class="min-h-10.5 rounded-lg bg-black px-4 text-[0.82rem] font-bold text-white hover:bg-gray-700 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600"
              id="applyCropButton"
              type="button"
            >
              Apply Crop
            </button>
          </div>
        </div>
      </div>

      <footer class="px-2 pt-10 pb-24 text-sm/6 text-(--muted)">
        <div
          class="mx-auto flex w-full flex-col items-start gap-6 px-4 sm:flex-row sm:items-center sm:justify-between sm:gap-8 md:px-6 lg:px-8"
        >
          <div
            class="relative z-0 inline-grid grid-cols-3 gap-0.5 rounded-full bg-gray-950/5 p-0.75 text-gray-950 transition-colors duration-200 dark:bg-white/10 dark:text-white"
            role="radiogroup"
            aria-label="Color theme"
          >
            <button
              class="rounded-full p-1.5 text-gray-950 transition-colors hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ink) aria-pressed:bg-white aria-pressed:text-gray-950 aria-pressed:ring aria-pressed:ring-gray-950/10 sm:p-1 dark:text-white dark:hover:bg-gray-700 dark:aria-pressed:bg-gray-700 dark:aria-pressed:text-white dark:aria-pressed:ring-transparent"
              data-theme-choice="system"
              role="radio"
              type="button"
              aria-label="Use system theme"
              aria-checked="false"
              aria-pressed="false"
              title="System theme"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="13" rx="1.5" />
                <path d="M8 21h8M12 17v4" />
              </svg>
            </button>
            <button
              class="rounded-full p-1.5 text-gray-950 transition-colors hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ink) aria-pressed:bg-white aria-pressed:text-gray-950 aria-pressed:ring aria-pressed:ring-gray-950/10 sm:p-1 dark:text-white dark:hover:bg-gray-700 dark:aria-pressed:bg-gray-700 dark:aria-pressed:text-white dark:aria-pressed:ring-transparent"
              data-theme-choice="light"
              role="radio"
              type="button"
              aria-label="Use light theme"
              aria-checked="false"
              aria-pressed="false"
              title="Light theme"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3.5" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
            </button>
            <button
              class="rounded-full p-1.5 text-gray-950 transition-colors hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--ink) aria-pressed:bg-white aria-pressed:text-gray-950 aria-pressed:ring aria-pressed:ring-gray-950/10 sm:p-1 dark:text-white dark:hover:bg-gray-700 dark:aria-pressed:bg-gray-700 dark:aria-pressed:text-white dark:aria-pressed:ring-transparent"
              data-theme-choice="dark"
              role="radio"
              type="button"
              aria-label="Use dark theme"
              aria-checked="false"
              aria-pressed="false"
              title="Dark theme"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path
                  d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"
                />
                <path
                  d="m17.5 3 .5 1.5L19.5 5 18 5.5 17.5 7 17 5.5 15.5 5 17 4.5 17.5 3Z"
                />
              </svg>
            </button>
          </div>
          <div
            class="flex flex-col gap-4 text-sm/6 text-(--muted) sm:flex-row sm:items-center sm:gap-3"
          >
            <p class="m-0">Copyright © 2026 SlavyanDesu</p>
            <span class="hidden sm:inline" aria-hidden="true">·</span>
            <a
              class="inline-flex items-center text-(--muted) transition-colors duration-150 hover:text-(--ink) hover:underline"
              href="https://github.com/SlavyanDesu/kaizen-form-generator"
              target="_blank"
              rel="noreferrer"
              aria-label="Kaizen Form Generator on GitHub"
              title="View project on GitHub"
            >
              <svg
                class="h-5 w-5 fill-current"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.24 3.18.77.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"
                />
              </svg>
            </a>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
